name: Weekly KapeFiles and RECmd Update

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write

concurrency:
  group: content-update-master
  cancel-in-progress: false

jobs:
  update-kapefiles-submodule:
    runs-on: ubuntu-latest
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - name: Require Netlify build hook
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update KapeFiles and RECmd submodules
        run: |
          git submodule update --remote --recursive src/content/kapefiles src/content/recmd

      - name: Check for submodule changes
        id: changes
        run: |
          if git diff --quiet src/content/kapefiles src/content/recmd; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push submodule update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/kapefiles src/content/recmd
          git commit -m "Update KapeFiles and RECmd submodules"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Trigger Netlify Build
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 10 -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "Netlify build triggered for latest KapeFiles and RECmd changes."
