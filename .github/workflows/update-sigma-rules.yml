name: Monthly Sigma Rules Update

on:
  schedule:
    # Run on the 1st of every month at 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write

concurrency:
  group: content-update-master
  cancel-in-progress: false

jobs:
  update-sigma-index:
    runs-on: ubuntu-latest
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - name: Require Netlify build hook
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sigma index
        run: pnpm run sigma:index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain public/sigma-rules/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push sigma rules update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sigma-rules/
          git commit -m "Update Sigma rules index"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Trigger Netlify Build
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 10 -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "Netlify build triggered for latest Sigma rules changes."
